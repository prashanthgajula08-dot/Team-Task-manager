services:
  - type: web
    name: team-task-manager
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: file:/opt/render/project/src/data/team-task-manager.db
    disk:
      name: app-data
      mountPath: /opt/render/project/src/data
      sizeGB: 10
